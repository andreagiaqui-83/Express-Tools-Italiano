name: "💡 Suggerimento / miglioramento"
description: "Proponi una modifica, una traduzione migliore o un miglioramento per Express Tools Italiano."
title: "[SUGGERIMENTO] "
body:
  - type: markdown
    attributes:
      value: |
        Grazie per contribuire al miglioramento di **Express Tools Italiano**.

        Usa questo modulo per proporre nuove idee, miglioramenti, correzioni delle traduzioni o altre modifiche utili al progetto.

  - type: dropdown
    id: suggestion-type
    attributes:
      label: "Tipo di suggerimento"
      options:
        - "Miglioramento di una traduzione"
        - "Testo o finestra da tradurre"
        - "Miglioramento dell'installer"
        - "Miglioramento dell'interfaccia"
        - "Compatibilità con un'altra versione di AutoCAD"
        - "Nuova funzione"
        - "Documentazione"
        - "Altro"
    validations:
      required: true

  - type: input
    id: autocad-version
    attributes:
      label: "Versione di AutoCAD"
      description: "Se pertinente, indica la versione e la lingua di AutoCAD."
      placeholder: "Esempio: AutoCAD 2027 Italiano"

  - type: input
    id: command
    attributes:
      label: "Comando interessato"
      description: "Se il suggerimento riguarda un comando specifico, indicane il nome."
      placeholder: "Esempio: TCASE, TXTEXP, TORIENT, BREAKLINE, ARCTEXT..."

  - type: textarea
    id: suggestion
    attributes:
      label: "Descrivi il suggerimento"
      description: "Spiega cosa vorresti modificare, aggiungere o migliorare."
      placeholder: "Descrivi qui la tua proposta..."
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: "Perché sarebbe utile?"
      description: "Spiega brevemente quale vantaggio porterebbe agli utenti di Express Tools Italiano."

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshot o esempi"
      description: "Se utile, trascina qui screenshot, immagini o altri esempi."

  - type: checkboxes
    id: checks
    attributes:
      label: "Verifica"
      options:
        - label: "Ho controllato che non esista già una proposta identica o molto simile."
          required: true
