name: Build ETIT QLATTACH Bridge 4.8

on:
  push:
    branches: [build/native-prompts-4.8]
    paths:
      - 'bridge-4.8/**'
      - '.github/workflows/build-etit-qlattachbridge-4.8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        working-directory: bridge-4.8
        run: dotnet restore ETIT_QLAttachBridge_4_8.csproj
      - name: Build
        working-directory: bridge-4.8
        run: dotnet build ETIT_QLAttachBridge_4_8.csproj -c Release --no-restore
      - name: Verify
        shell: pwsh
        run: |
          $dll='bridge-4.8/bin/Release/net10.0/ETIT_QLAttachBridge_4_8.dll'
          if (!(Test-Path $dll)) { throw 'Bridge DLL non generata' }
          Get-FileHash $dll -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: ETIT_QLAttachBridge_4_8
          path: bridge-4.8/bin/Release/net10.0/ETIT_QLAttachBridge_4_8.dll
          if-no-files-found: error
