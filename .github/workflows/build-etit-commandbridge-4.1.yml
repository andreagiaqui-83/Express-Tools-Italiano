name: Build ETIT CommandBridge 4.1

on:
  push:
    branches:
      - build/commandstack-4.1
    paths:
      - 'bridge-4.1/**'
      - '.github/workflows/build-etit-commandbridge-4.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        working-directory: bridge-4.1
        run: dotnet restore ETIT_CommandBridge_4_1.csproj
      - name: Build
        working-directory: bridge-4.1
        run: dotnet build ETIT_CommandBridge_4_1.csproj -c Release --no-restore
      - name: Inspect output
        shell: pwsh
        run: |
          $dll = 'bridge-4.1/bin/Release/net10.0/ETIT_CommandBridge_4_1.dll'
          if (!(Test-Path $dll)) { throw 'Bridge DLL non generata' }
          Get-FileHash $dll -Algorithm SHA256
      - name: Upload bridge
        uses: actions/upload-artifact@v4
        with:
          name: ETIT_CommandBridge_4_1
          path: bridge-4.1/bin/Release/net10.0/ETIT_CommandBridge_4_1.dll
          if-no-files-found: error
