name: Build ETIT CommandBridge 4.7
on:
  push:
    branches: [build/arctext-final-4.7]
    paths:
      - 'bridge-4.7/**'
      - '.github/workflows/build-etit-commandbridge-4.7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        working-directory: bridge-4.7
        run: dotnet restore ETIT_CommandBridge_4_7.csproj
      - name: Build
        working-directory: bridge-4.7
        run: dotnet build ETIT_CommandBridge_4_7.csproj -c Release --no-restore
      - name: Verify
        shell: pwsh
        run: |
          $dll='bridge-4.7/bin/Release/net10.0/ETIT_CommandBridge_4_7.dll'
          if (!(Test-Path $dll)) { throw 'Bridge DLL non generata' }
          Get-FileHash $dll -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: ETIT_CommandBridge_4_7
          path: bridge-4.7/bin/Release/net10.0/ETIT_CommandBridge_4_7.dll
          if-no-files-found: error
