name: Build ETIT NativePromptBridge 4.9
on:
  push:
    branches: [build/native-prompts-4.9]
    paths:
      - 'bridge-4.9/**'
      - '.github/workflows/build-etit-nativepromptbridge-4.9.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        working-directory: bridge-4.9
        run: dotnet restore ETIT_NativePromptBridge_4_9.csproj
      - name: Build
        working-directory: bridge-4.9
        run: dotnet build ETIT_NativePromptBridge_4_9.csproj -c Release --no-restore
      - name: Verify
        shell: pwsh
        run: |
          $dll='bridge-4.9/bin/Release/net10.0/ETIT_NativePromptBridge_4_9.dll'
          if (!(Test-Path $dll)) { throw 'Bridge DLL non generata' }
          Get-FileHash $dll -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: ETIT_NativePromptBridge_4_9
          path: bridge-4.9/bin/Release/net10.0/ETIT_NativePromptBridge_4_9.dll
          if-no-files-found: error
